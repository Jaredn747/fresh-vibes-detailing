name: CI/CD

on:
  push:
    branches:
      - testing
    paths:
      - 'index.html'
      - 'booking.html'
      - 'gallery.html'
      - 'css/**'
      - 'js/**'
  pull_request:
    branches:
      - testing
    paths:
      - 'index.html'
      - 'booking.html'
      - 'gallery.html'
      - 'css/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static site files
        run: |
          set -euo pipefail

          for file in index.html booking.html gallery.html css/style.css js/script.js; do
            test -f "$file"
          done

          grep -q '<script src="js/script.js"></script>' index.html
          grep -q '<link rel="stylesheet" href="css/style.css">' index.html
          grep -q '<nav class="navbar">' gallery.html
          grep -q '<footer id="contact">' gallery.html
          grep -q '<div id="contact-info-form"' booking.html || grep -q '<form id="contact-info-form"' booking.html

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4