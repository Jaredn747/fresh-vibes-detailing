<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Fresh Vibes Detailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Modak&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="booking-body">
    <main class="booking-card centered-card">
        <section id="login-section" aria-labelledby="admin-login-title">
            <div class="icon-circle-large" aria-hidden="true">🔒</div>
            <h1 id="admin-login-title" class="booking-title">Admin Login</h1>
            <p class="booking-subtitle">Sign in to manage Fresh Vibes Detailing.</p>

            <form id="admin-login-form" novalidate>
                <div class="input-wrapper">
                    <label for="admin-password">Password</label>
                    <input
                        id="admin-password"
                        class="booking-input"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <p id="admin-login-error" class="admin-status has-error" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-booking-full">Log In</button>
            </form>

            <a href="index.html" class="link-home">Back to Home</a>
        </section>

        <section id="dashboard-section" class="admin-dashboard" hidden aria-labelledby="dashboard-title">
            <div class="icon-circle-large" aria-hidden="true">✓</div>
            <h2 id="dashboard-title" class="section-heading">Admin Dashboard</h2>
            <p class="booking-subtitle">You are logged in successfully.</p>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
